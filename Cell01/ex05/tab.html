<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tab</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            border: 1px solid black;
        }
        td {
            padding: 40px 15px;
            border: 1px solid black;
            font-family: sans-serif;
        }
        .first-cell {
            background-color: #c48e78; 
            width: 45%;
        }
        .second-cell {
            background-color: #8970ac; 
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">A cell</td>
            <td class="second-cell">B cell</td>
        </tr>
    </table>

</body>
</html>
