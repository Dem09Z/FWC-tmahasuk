<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive</title>
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        table {
            width: 100%;
            height: 100vh;
            border-collapse: collapse;
            border: 1px solid black;
            table-layout: fixed;
        }

        td {
            border: 1px solid black;
            padding: 15px;
            font-family: sans-serif;
            font-size: 1.5rem;
            word-wrap: break-word;
        }

        .first-cell {
            background-color: #78a2c4; 
            width: 50%;
        }

        .second-cell {
            background-color: #c07453; 
            width: 50%;
        }
    </style>
</head>
<body>

    <table>
        <tr>
            <td class="first-cell">A cell</td>
            <td class="second-cell">B cell</td>
        </tr>
    </table>

</body>
</html>
