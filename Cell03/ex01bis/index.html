<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Balloon</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        #balloon {
            width: 200px;
            height: 200px;
            background-color: red;
            border-radius: 50%;
            cursor: pointer;
        }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div id="balloon"></div>

    <script>
        const colors = ['red', 'green', 'blue'];
        let colorIdx = 0;
        let size = 200;

        $('#balloon').on('click', function() {
            size += 10;
            if (size > 420) {
                size = 200;
                colorIdx = 0;
            } else {
                colorIdx = (colorIdx + 1) % colors.length;
            }
            $(this).css({
                'width': size + 'px',
                'height': size + 'px',
                'background-color': colors[colorIdx]
            });
        });

        $('#balloon').on('mouseleave', function() {
            if (size > 200) {
                size -= 5;
                colorIdx = (colorIdx - 1 + colors.length) % colors.length;
                $(this).css({
                    'width': size + 'px',
                    'height': size + 'px',
                    'background-color': colors[colorIdx]
                });
            }
        });
    </script>
</body>
</html>
