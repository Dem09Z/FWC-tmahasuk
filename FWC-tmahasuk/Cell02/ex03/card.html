<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card-container">
        <div class="header-title">User Profile Card</div>

        <div class="card">
            <table class="invisible-table">
                <tr>
                    <td>
                        <img src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?q=80&w=400&auto=format&fit=crop" alt="Profile Picture" class="profile-img">
                    </td>
                </tr>
                <tr>
                    <td>
                        <div class="login">tmahasuk</div>
                    </td>
                </tr>
                <tr>
                    <td>
                        <!-- 2-3 words description -->
                        <div class="description">Level 11, :D</div>
                        <div class="location">Bangkok Thailand</div>
                    </td>
                </tr>
                <tr>
                    <td class="social-icons">
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/1384/1384031.png" alt="IG"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/5969/5969020.png" alt="Twitter"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/3116/3116491.png" alt="Tiktok"></a>
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/128/2168/2168281.png" alt="Facebook"></a>
                    </td>
                </tr>
                <tr>
                    <td>
                        <button class="contact-btn">Contact</button>
                    </td>
                </tr>
            </table>
        </div>
    </div>

</body>
</html>
